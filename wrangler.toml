name = "webhawk"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# KV namespace for event deduplication
[[kv_namespaces]]
binding = "DEDUP_KV"
id = "placeholder_dedup_kv_id"
preview_id = "placeholder_dedup_kv_preview_id"

[observability]
enabled = true

[dev]
port = 8787
local_protocol = "http"
